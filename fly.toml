# fly.toml app configuration file generated for xcalibracao on 2026-07-21T03:36:49Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'xcalibracao'
primary_region = 'gru'

[build]

[env]
  SISCALIB_DATA = '/data'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
