<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>sisCalibracao · Alertas</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="vendor/bootstrap-icons.min.css">
<link rel="stylesheet" href="vendor/xcmasm-govbr.css">
<link rel="icon" type="image/png" href="vendor/icons/gauge.png">
<link rel="stylesheet" href="siscalib.css">
</head><body class="app">
<script src="app.js"></script>
<main class="main">
  <div id="tabAlertas"></div>
  <div id="tabLab" style="margin-top:28px"></div>
  <div id="tabCt" style="margin-top:28px"></div>
</main>
<script>
montarShell("alertas.html");
function money(n) { return "R$ " + Number(n || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
const ST_ORDEM = ["VENCIDO", "A_VENCER_7", "A_VENCER_30", "A_VENCER_60", "VALIDO", "SEM_DATA"];

const tabAlertas = montarTabela({
  el: document.getElementById("tabAlertas"),
  titulo: "Painel de Alertas",
  exportNome: "alertas",
  buscaValor: i => [i.codigo_interno, i.equipamento, i.setor].filter(Boolean).join(" "),
  colunas: [
    { key: "codigo_interno", label: "Código", render: i => `<a href="ficha.html?id=${i.id}">${esc(i.codigo_interno) || i.id}</a>` },
    { key: "equipamento", label: "Equipamento", render: i => esc(i.equipamento) || "—" },
    { key: "disciplina", label: "Disc.", filtro: true, valor: i => i.disciplina || "" },
    { key: "setor", label: "Setor", filtro: true, render: i => esc(i.setor) || "—" },
    { key: "data_validade", label: "Validade", valor: i => i.data_validade || "9999", render: i => fmtData(i.data_validade) },
    { key: "dias_restantes", label: "Dias", valor: i => i.dias_restantes ?? 1e9, render: i => i.dias_restantes == null ? "—" : i.dias_restantes },
    { key: "status", label: "Status", filtro: true, ordem: ST_ORDEM, valor: i => i.status, rotulo: v => STATUS_LABEL[v] || v, render: i => badgeStatus(i.status) },
  ],
});

const tabLab = montarTabela({
  el: document.getElementById("tabLab"),
  titulo: "Acreditações a vencer",
  exportNome: "acreditacoes-a-vencer",
  buscaValor: l => l.razao_social || "",
  colunas: [
    { key: "razao_social", label: "Laboratório" },
    { key: "numero_cgcre", label: "CGCRE", render: l => esc(l.numero_cgcre) || "—" },
    { key: "acreditacao_validade", label: "Validade", valor: l => l.acreditacao_validade || "9999", render: l => fmtData(l.acreditacao_validade) },
    { key: "status_acreditacao", label: "Status", filtro: true, ordem: ST_ORDEM, valor: l => l.status_acreditacao, rotulo: v => STATUS_LABEL[v] || v, render: l => badgeStatus(l.status_acreditacao) },
  ],
});

const tabCt = montarTabela({
  el: document.getElementById("tabCt"),
  titulo: "Contratos a vencer / saldo baixo",
  exportNome: "contratos-a-vencer",
  buscaValor: c => [c.numero, c.laboratorio].filter(Boolean).join(" "),
  colunas: [
    { key: "numero", label: "Número" },
    { key: "laboratorio", label: "Fornecedor", render: c => esc(c.laboratorio) || "—" },
    { key: "vigencia_fim", label: "Vigência", valor: c => c.vigencia_fim || "9999", render: c => `${fmtData(c.vigencia_fim)} ${badgeStatus(c.status_vigencia)}` },
    { key: "status_saldo", label: "Saldo", filtro: true, valor: c => c.status_saldo, render: c => `<span class="bdg saldo-${esc(c.status_saldo)}">${esc(c.status_saldo)}</span>` },
  ],
});

(async () => {
  try { tabAlertas.setDados(await SDK.get("/alertas")); } catch (e) {}
  try { tabLab.setDados(await SDK.get("/laboratorios/alertas")); } catch (e) {}
  try { tabCt.setDados(await SDK.get("/contratos/alertas")); } catch (e) {}
})();
</script></body></html>
