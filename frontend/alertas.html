<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>sisCalibracao · Alertas</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="vendor/bootstrap-icons.min.css">
<link rel="stylesheet" href="vendor/xcmasm-govbr.css">
<link rel="icon" type="image/png" href="vendor/icons/gauge.png">
<link rel="stylesheet" href="siscalib.css">
</head><body class="app">
<script src="app.js"></script>
<main class="main">
  <h1>Painel de Alertas</h1>
  <div class="toolbar">
    <select id="disciplina"><option value="">Disciplina</option><option>ELE</option><option>MEC</option></select>
    <select id="setor"><option value="">Setor</option></select>
    <a class="btn ghost" id="csv"><i class="bi bi-download"></i> Exportar CSV</a>
  </div>
  <div class="muted" id="cont" style="margin-bottom:8px"></div>
  <div class="twrap"><table id="tab"><thead><tr>
    <th>Código</th><th>Equipamento</th><th>Setor</th><th>Validade</th>
    <th>Dias</th><th>Status</th></tr></thead><tbody></tbody></table></div>

  <h1 style="margin-top:28px">Acreditações a vencer</h1>
  <div class="twrap"><table id="tabLab"><thead><tr>
    <th>Laboratório</th><th>CGCRE</th><th>Validade</th><th>Status</th>
  </tr></thead><tbody></tbody></table></div>

  <h1 style="margin-top:28px">Contratos a vencer / saldo baixo</h1>
  <div class="twrap"><table id="tabCt"><thead><tr>
    <th>Número</th><th>Fornecedor</th><th>Vigência</th><th>Saldo</th>
  </tr></thead><tbody></tbody></table></div>
</main>
<script>
montarShell("alertas.html");
const disciplina = document.getElementById("disciplina"), setor = document.getElementById("setor"),
      cont = document.getElementById("cont"), csv = document.getElementById("csv");
function params() { return { disciplina: disciplina.value, setor: setor.value }; }
async function carregar() {
  const itens = await SDK.get("/alertas", params());
  cont.textContent = `${itens.length} alerta(s)`;
  const u = new URL("/api/v1/alertas", location.origin);
  u.searchParams.set("formato", "csv");
  Object.entries(params()).forEach(([k, v]) => v && u.searchParams.set(k, v));
  csv.href = u;
  document.querySelector("#tab tbody").innerHTML = itens.map(i => `
    <tr><td><a href="ficha.html?id=${i.id}">${esc(i.codigo_interno)}</a></td>
    <td>${esc(i.equipamento)}</td><td>${esc(i.setor)}</td>
    <td>${fmtData(i.data_validade)}</td>
    <td>${i.dias_restantes == null ? "—" : i.dias_restantes}</td>
    <td>${badgeStatus(i.status)}</td></tr>`).join("")
    || `<tr><td colspan="6" class="muted">Sem alertas.</td></tr>`;
}
[disciplina, setor].forEach(e => e.onchange = carregar);

async function carregarLabs() {
  const tb = document.querySelector("#tabLab tbody");
  let itens;
  try { itens = await SDK.get("/laboratorios/alertas"); }
  catch (err) { tb.innerHTML = `<tr><td colspan="4" class="sev-erro">Falha: ${esc(err.message)}</td></tr>`; return; }
  tb.innerHTML = itens.map(l => `
    <tr><td>${esc(l.razao_social)}</td>
    <td>${esc(l.numero_cgcre) || "—"}</td>
    <td>${fmtData(l.acreditacao_validade)}</td>
    <td>${badgeStatus(l.status_acreditacao)}</td></tr>`).join("")
    || `<tr><td colspan="4" class="muted">Nenhuma acreditação a vencer.</td></tr>`;
}

async function carregarContratos() {
  const tb = document.querySelector("#tabCt tbody");
  let itens;
  try { itens = await SDK.get("/contratos/alertas"); }
  catch (err) { tb.innerHTML = `<tr><td colspan="4" class="sev-erro">Falha: ${esc(err.message)}</td></tr>`; return; }
  tb.innerHTML = itens.map(c => `
    <tr><td>${esc(c.numero)}</td>
    <td>${esc(c.fornecedor) || "—"}</td>
    <td>${fmtData(c.vigencia_fim)} ${badgeStatus(c.status_vigencia)}</td>
    <td><span class="bdg saldo-${esc(c.status_saldo)}">${esc(c.status_saldo)}</span></td></tr>`).join("")
    || `<tr><td colspan="4" class="muted">Nenhum contrato a vencer ou com saldo baixo.</td></tr>`;
}

(async () => {
  const r = await SDK.get("/instrumentos");
  [...new Set(r.itens.map(i => i.setor).filter(Boolean))].sort()
    .forEach(s => setor.add(new Option(s, s)));
  carregar();
  carregarLabs();
  carregarContratos();
})();
</script></body></html>
