<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SisCalib · Inventário</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="vendor/bootstrap-icons.min.css">
<link rel="stylesheet" href="vendor/xcmasm-govbr.css">
<link rel="stylesheet" href="siscalib.css">
</head><body class="app">
<script src="app.js"></script>
<main class="main">
  <h1>Inventário de Instrumentos</h1>
  <div class="toolbar">
    <input type="search" id="busca" placeholder="Buscar por código, série, equipamento...">
    <a class="btn" href="cadastro.html"><i class="bi bi-plus-lg"></i> Novo</a>
    <button class="funil-extra btn ghost" data-filtro="marca"><i class="bi bi-funnel"></i> Marca</button>
    <button class="funil-extra btn ghost" data-filtro="modelo"><i class="bi bi-funnel"></i> Modelo</button>
    <div class="export-grp" style="margin-left:auto">
      <span class="muted">Exportar:</span>
      <button class="btn ghost" data-exp="csv">CSV</button>
      <button class="btn ghost" data-exp="xlsx">XLSX</button>
      <button class="btn ghost" data-exp="pdf">PDF</button>
    </div>
  </div>
  <div class="selbar" id="selbar" style="display:none">
    <b id="selcount">0 selecionado(s)</b>
    <button class="btn" id="btnLote"><i class="bi bi-pencil-square"></i> Editar selecionados</button>
    <button class="btn ghost" id="btnLimpar">Limpar seleção</button>
  </div>
  <div class="muted" id="cont" style="margin-bottom:8px"></div>
  <div class="twrap"><table id="tab"><thead><tr>
    <th class="chk"><input type="checkbox" id="chkAll" title="Selecionar todos"></th>
    <th data-col="disciplina" data-filtro="disciplina">Disc.</th>
    <th data-col="equipamento" data-filtro="equipamento">Equipamento</th>
    <th data-col="marcamodelo">Marca/Modelo</th>
    <th data-col="codigo">Cód. interno</th>
    <th data-col="serial">Série</th>
    <th data-col="sistema" data-filtro="sistema">Sistema</th>
    <th data-col="status" data-filtro="status">Status</th>
    <th data-col="data_validade">Validade</th>
    <th data-col="classe" data-filtro="classe">Prioridade</th>
  </tr></thead><tbody></tbody></table></div>
</main>
<script>
montarShell("inventario.html");
let timer;
let todos = [];                       // lista completa carregada uma vez
let itensAtuais = [];                 // = visiveis(); fonte do render e do export
const selecionados = new Set();
const filtrosCol = {};                // { coluna: Set(valores) }
let ordenacao = { coluna: null, dir: null };  // dir: "asc" | "desc"

const busca = document.getElementById("busca"),
      cont = document.getElementById("cont"),
      chkAll = document.getElementById("chkAll"),
      selbar = document.getElementById("selbar"),
      selcount = document.getElementById("selcount");

// valor de uma coluna para filtro/ordenação/exibição
function valorCol(i, col) {
  switch (col) {
    case "codigo": return i.codigo_interno || i.codigo_patrimonial || "";
    case "marcamodelo": return [i.marca, i.modelo].filter(Boolean).join(" ");
    case "classe": return i.classe_prioridade || "";
    default: return i[col] == null ? "" : i[col];
  }
}

const semAcento = s => s.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();

// ordem de urgência (status) e de severidade (prioridade) — ordenação e popover
const ORDEM_STATUS = ["VENCIDO", "A_VENCER_7", "A_VENCER_30", "A_VENCER_60",
                      "VALIDO", "SEM_DATA", "BAIXADO"];
const ORDEM_CLASSE = ["MAXIMA", "MEDIA", "BAIXA", "MUITO_BAIXA", "NAO_CLASSIFICADO"];

// rótulos curtos de prioridade (coluna + popover)
const PRIO_LABEL = {
  MAXIMA: "Máxima", MEDIA: "Média", BAIXA: "Baixa",
  MUITO_BAIXA: "Muito baixa", NAO_CLASSIFICADO: "Não classificado",
};
const PRIO_BADGE = { MAXIMA: "red", MEDIA: "amber", BAIXA: "slate", MUITO_BAIXA: "slate" };

// texto amigável para valores codificados nos popovers de filtro
function rotuloValor(col, v) {
  if (col === "status") return STATUS_LABEL[v] || v;
  if (col === "classe") return PRIO_LABEL[v] || v;
  return v;
}

function badgePrioridade(i) {
  if (i.igp == null) return '<span class="muted">—</span>';
  const c = i.classe_prioridade;
  return `<span class="bdg ${PRIO_BADGE[c] || "slate"}">${PRIO_LABEL[c] || c}</span>`;
}

function cmp(a, b, col) {
  if (col === "data_validade") {
    const x = a.data_validade || "9999-99-99", y = b.data_validade || "9999-99-99";
    return x < y ? -1 : x > y ? 1 : 0;
  }
  if (col === "status") {
    return ORDEM_STATUS.indexOf(a.status) - ORDEM_STATUS.indexOf(b.status);
  }
  if (col === "classe") {
    return ORDEM_CLASSE.indexOf(a.classe_prioridade) - ORDEM_CLASSE.indexOf(b.classe_prioridade);
  }
  const x = semAcento(String(valorCol(a, col))), y = semAcento(String(valorCol(b, col)));
  return x < y ? -1 : x > y ? 1 : 0;
}

// fonte única: aplica busca → filtros → ordenação sobre `todos`
function visiveis() {
  let r = todos;
  if (busca.value.trim()) {
    const b = semAcento(busca.value);
    r = r.filter(i => semAcento([i.codigo_interno, i.serial, i.equipamento, i.modelo, i.marca]
      .filter(Boolean).join(" ")).includes(b));
  }
  for (const [col, sel] of Object.entries(filtrosCol)) {
    if (sel && sel.size) r = r.filter(i => sel.has(String(valorCol(i, col))));
  }
  if (ordenacao.coluna) {
    const sinal = ordenacao.dir === "desc" ? -1 : 1;
    r = [...r].sort((a, b) => sinal * cmp(a, b, ordenacao.coluna));
  }
  return r;
}

function indicadorSort(col) {
  if (ordenacao.coluna !== col) return "";
  return ordenacao.dir === "asc" ? " ▲" : ordenacao.dir === "desc" ? " ▼" : "";
}

function atualizarCabecalhos() {
  document.querySelectorAll("#tab thead th[data-col]").forEach(th => {
    const col = th.dataset.col;
    const base = th.dataset.label || (th.dataset.label = th.textContent.trim());

    // estrutura estável criada uma única vez (não recriar a cada refresh,
    // senão o nó do funil que ancora um popover aberto é destruído)
    let ind = th.querySelector(".sort-ind");
    if (!ind) {
      th.textContent = base;
      ind = document.createElement("span");
      ind.className = "sort-ind";
      th.appendChild(ind);
      if (th.dataset.filtro) {
        const f = document.createElement("i");
        f.className = "bi bi-funnel";
        f.dataset.filtro = th.dataset.filtro;
        th.append(" ", f);
      }
    }

    // a cada chamada: só atualiza o texto do indicador e a classe do funil
    ind.textContent = indicadorSort(col);
    const funil = th.querySelector("i[data-filtro]");
    if (funil) {
      const ativo = !!filtrosCol[th.dataset.filtro]?.size;
      funil.className = ativo ? "bi bi-funnel-fill ativo" : "bi bi-funnel";
    }
  });
  document.querySelectorAll(".funil-extra").forEach(b => {
    const f = b.dataset.filtro;
    b.classList.toggle("ativo", !!filtrosCol[f]?.size);
  });
}

function atualizarBarra() {
  selcount.textContent = `${selecionados.size} selecionado(s)`;
  selbar.style.display = selecionados.size ? "flex" : "none";
}

function renderLinhas() {
  document.querySelector("#tab tbody").innerHTML = itensAtuais.map(i => `
    <tr data-id="${i.id}">
      <td class="chk"><input type="checkbox" class="rowchk" data-id="${i.id}" ${selecionados.has(i.id) ? "checked" : ""}></td>
      <td>${esc(i.disciplina)}</td>
      <td>${esc(i.equipamento)}</td>
      <td>${esc([i.marca, i.modelo].filter(Boolean).join(" "))}</td>
      <td>${esc(i.codigo_interno || i.codigo_patrimonial)}</td>
      <td>${esc(i.serial)}</td>
      <td>${esc(i.sistema)}</td>
      <td>${badgeStatus(i.status)}</td>
      <td>${fmtData(i.data_validade)}</td>
      <td>${badgePrioridade(i)}</td></tr>`).join("")
    || `<tr><td colspan="10" class="muted">Nada encontrado.</td></tr>`;
}

// recomputa visiveis(), atualiza contagem/cabeçalhos e re-renderiza
function refrescar() {
  itensAtuais = visiveis();
  cont.textContent = `${itensAtuais.length} de ${todos.length} instrumento(s)`;
  atualizarCabecalhos();
  renderLinhas();
}

// qualquer mudança de busca/filtro/ordenação limpa a seleção
function mudouVisao() {
  selecionados.clear();
  chkAll.checked = false;
  atualizarBarra();
  refrescar();
}

// recarrega do backend (após edições) preservando filtros/ordenação
async function recarregar() {
  const r = await SDK.get("/instrumentos");
  todos = r.itens;
  refrescar();
}

// clique na linha (exceto checkbox) → modal da ficha
document.querySelector("#tab tbody").addEventListener("click", async (e) => {
  if (e.target.classList.contains("rowchk")) return;
  const tr = e.target.closest("tr[data-id]");
  if (!tr) return;
  const i = await SDK.get("/instrumentos/" + tr.dataset.id);
  abrirModal(`${i.codigo_interno || i.codigo_patrimonial || ""} — ${i.equipamento || ""}`,
    renderFichaResumo(i),
    `<a class="btn ghost" href="ficha.html?id=${i.id}">Ficha completa</a>
     <a class="btn" href="cadastro.html?id=${i.id}">Editar</a>`);
});

// checkbox por linha
document.querySelector("#tab tbody").addEventListener("change", (e) => {
  if (!e.target.classList.contains("rowchk")) return;
  const id = parseInt(e.target.dataset.id);
  if (e.target.checked) selecionados.add(id); else selecionados.delete(id);
  atualizarBarra();
});

chkAll.onchange = () => {
  if (chkAll.checked) itensAtuais.forEach(i => selecionados.add(i.id));
  else selecionados.clear();
  renderLinhas();
  atualizarBarra();
};

document.getElementById("btnLimpar").onclick = () => {
  selecionados.clear(); chkAll.checked = false; renderLinhas(); atualizarBarra();
};

document.getElementById("btnLote").onclick = () => abrirEdicaoLote();

// ── Ordenação por clique no cabeçalho ───────────────────────────────────────
document.querySelector("#tab thead").addEventListener("click", (e) => {
  if (e.target.closest(".bi-funnel, .bi-funnel-fill")) return;  // funil tem handler próprio
  const th = e.target.closest("th[data-col]");
  if (!th) return;
  const col = th.dataset.col;
  if (ordenacao.coluna !== col) ordenacao = { coluna: col, dir: "asc" };
  else if (ordenacao.dir === "asc") ordenacao.dir = "desc";
  else ordenacao = { coluna: null, dir: null };   // 3º clique: sem ordem
  mudouVisao();
});

// ── Popover de filtro multi-seleção ─────────────────────────────────────────
function fecharPopover() {
  document.getElementById("filtroPop")?.remove();
  document.removeEventListener("click", _foraPop, true);
}
function _foraPop(e) {
  const pop = document.getElementById("filtroPop");
  if (pop && !pop.contains(e.target) && !e.target.closest("[data-filtro]")) fecharPopover();
}
function abrirPopover(col, ancora) {
  fecharPopover();
  const valores = [...new Set(todos.map(i => String(valorCol(i, col))).filter(v => v !== ""))];
  if (col === "status") valores.sort((a, b) => ORDEM_STATUS.indexOf(a) - ORDEM_STATUS.indexOf(b));
  else if (col === "classe") valores.sort((a, b) => ORDEM_CLASSE.indexOf(a) - ORDEM_CLASSE.indexOf(b));
  else valores.sort();
  const sel = filtrosCol[col] || new Set();
  const itens = valores.map(v =>
    `<label><input type="checkbox" value="${esc(v)}" ${sel.has(v) ? "checked" : ""}> ${esc(rotuloValor(col, v))}</label>`).join("");
  const pop = document.createElement("div");
  pop.id = "filtroPop";
  pop.className = "filtro-pop";
  pop.innerHTML = `<div class="filtro-acts">
      <button type="button" data-act="all">Marcar todos</button>
      <button type="button" data-act="none">Limpar</button></div>
    <div class="filtro-itens">${itens || '<span class="muted">Sem valores</span>'}</div>`;
  document.body.appendChild(pop);
  const r = ancora.getBoundingClientRect();
  pop.style.top = (r.bottom + window.scrollY + 4) + "px";
  pop.style.left = (r.left + window.scrollX) + "px";

  pop.addEventListener("change", () => {
    const marcados = [...pop.querySelectorAll("input:checked")].map(c => c.value);
    if (marcados.length) filtrosCol[col] = new Set(marcados);
    else delete filtrosCol[col];
    mudouVisao();
  });
  pop.querySelector('[data-act="all"]').onclick = () => {
    pop.querySelectorAll("input").forEach(c => c.checked = true);
    pop.dispatchEvent(new Event("change"));
  };
  pop.querySelector('[data-act="none"]').onclick = () => {
    pop.querySelectorAll("input").forEach(c => c.checked = false);
    pop.dispatchEvent(new Event("change"));
  };
  setTimeout(() => document.addEventListener("click", _foraPop, true), 0);
}
document.addEventListener("keydown", e => { if (e.key === "Escape") fecharPopover(); });

// abre o popover só pelo ícone de funil (no th) ou pelos botões .funil-extra (toolbar)
document.addEventListener("click", (e) => {
  const gatilho = e.target.closest(".bi-funnel, .bi-funnel-fill, .funil-extra");
  if (!gatilho) return;
  e.stopPropagation();
  // o data-filtro pode estar no próprio gatilho (funil no th) ou num ancestral (botão .funil-extra)
  const ancora = gatilho.closest("[data-filtro]");
  if (!ancora) return;
  abrirPopover(ancora.dataset.filtro, ancora);
});

// ── Export ──────────────────────────────────────────────────────────────────
document.querySelector(".export-grp").addEventListener("click", async (e) => {
  const btn = e.target.closest("[data-exp]");
  if (!btn) return;
  const ids = itensAtuais.map(i => i.id);
  if (!ids.length) { alert("Nada a exportar."); return; }
  const orig = btn.textContent;
  btn.disabled = true; btn.textContent = "gerando…";
  try { await SDK.exportar(ids, btn.dataset.exp); }
  catch (err) { alert("Falha ao exportar: " + err.message); }
  finally { btn.disabled = false; btn.textContent = orig; }
});

// busca reaproveita o debounce, mas filtra client-side
busca.oninput = () => { clearTimeout(timer); timer = setTimeout(mudouVisao, 200); };

// inicialização: carrega tudo uma vez
(async () => {
  window._dominios = await SDK.get("/dominios");
  await recarregar();
})();

// ── Edição em lote ──────────────────────────────────────────────────────────
const STATUS_OP = ["ATIVO", "EM_CALIBRACAO", "EM_MANUTENCAO", "REPROVADO", "BLOQUEADO", "BAIXADO"];
const CAMPOS_LOTE = [
  { key: "codigo_patrimonial", label: "Patrimônio", tipo: "text" },
  { key: "familia_id", label: "Família", tipo: "dom", dom: "familias" },
  { key: "tipo_id", label: "Tipo", tipo: "dom", dom: "tipos" },
  { key: "grandeza_id", label: "Grandeza", tipo: "dom", dom: "grandezas" },
  { key: "unidade_id", label: "Unidade", tipo: "dom", dom: "unidades" },
  { key: "status_operacional", label: "Status oper.", tipo: "opcoes", opcoes: STATUS_OP },
  { key: "ciclo_meses", label: "Ciclo (m)", tipo: "num" },
  { key: "secao", label: "Seção", tipo: "text" },
  { key: "bancada", label: "Bancada", tipo: "text" },
  { key: "fu", label: "FU", tipo: "igp" }, { key: "nc", label: "NC", tipo: "igp" },
  { key: "ab", label: "AB", tipo: "igp" }, { key: "cm", label: "CM", tipo: "igp" },
  { key: "ci", label: "CI", tipo: "igp" },
];
const INT_KEYS = ["familia_id", "tipo_id", "grandeza_id", "unidade_id", "ciclo_meses", "fu", "nc", "ab", "cm", "ci"];

function _optsDom(domKey, valor) {
  const itens = window._dominios[domKey] || [];
  return `<option value="">—</option>` + itens.map(o =>
    `<option value="${o.id}" ${o.id == valor ? "selected" : ""}>${esc(o.simbolo ? `${o.nome} (${o.simbolo})` : o.nome)}</option>`).join("");
}
function _optsLista(lista, valor) {
  return `<option value="">—</option>` + lista.map(o =>
    `<option ${o == valor ? "selected" : ""}>${o}</option>`).join("");
}

function _celula(campo, item) {
  const v = item[campo.key];
  const at = `data-id="${item.id}" data-key="${campo.key}"`;
  if (campo.tipo === "dom") return `<select ${at}>${_optsDom(campo.dom, v)}</select>`;
  if (campo.tipo === "opcoes") return `<select ${at}>${_optsLista(campo.opcoes, v)}</select>`;
  if (campo.tipo === "num") return `<input ${at} type="number" value="${v ?? ""}">`;
  if (campo.tipo === "igp") return `<input ${at} type="number" min="1" max="3" value="${v ?? ""}">`;
  return `<input ${at} type="text" value="${esc(v) ?? ""}">`;
}

function abrirEdicaoLote() {
  const sel = itensAtuais.filter(i => selecionados.has(i.id));
  if (!sel.length) return;
  const picks = CAMPOS_LOTE.map(c =>
    `<label><input type="checkbox" class="pickcampo" value="${c.key}"> ${c.label}</label>`).join("");
  abrirModal(`Editar ${sel.length} item(ns)`,
    `<div><b>1. Campos a editar</b>
       <div class="campos-pick" id="picker">${picks}</div></div>
     <div id="loteArea"></div>`,
    `<button class="btn" id="btnSalvarLote">Salvar tudo</button>
     <button class="btn ghost" onclick="fecharModal()">Cancelar</button>
     <span id="loteMsg" class="muted"></span>`);

  const area = document.getElementById("loteArea");
  function montarTabela() {
    const escolhidos = [...document.querySelectorAll(".pickcampo:checked")]
      .map(c => CAMPOS_LOTE.find(x => x.key === c.value));
    if (!escolhidos.length) { area.innerHTML = `<p class="muted" style="margin-top:10px">Escolha ao menos um campo.</p>`; return; }
    const ths = escolhidos.map(c =>
      `<th>${c.label} <button type="button" class="btn ghost" style="padding:1px 6px" data-fill="${c.key}" title="Preencher coluna">↓</button></th>`).join("");
    const rows = sel.map(i => `<tr><td>${esc(i.codigo_interno || i.codigo_patrimonial)}</td>
      <td>${esc(i.equipamento)}</td>${escolhidos.map(c => `<td>${_celula(c, i)}</td>`).join("")}</tr>`).join("");
    area.innerHTML = `<div class="twrap" style="margin-top:10px"><table class="lote-tab">
      <thead><tr><th>Código</th><th>Equipamento</th>${ths}</tr></thead><tbody>${rows}</tbody></table></div>`;
    area.querySelectorAll("[data-fill]").forEach(b => b.onclick = () => {
      const key = b.dataset.fill;
      const campos = [...area.querySelectorAll(`[data-key="${key}"]`)];
      if (!campos.length) return;
      const val = campos[0].value;
      campos.forEach(c => c.value = val);
    });
  }
  document.getElementById("picker").addEventListener("change", montarTabela);

  document.getElementById("btnSalvarLote").onclick = async () => {
    const escolhidos = [...document.querySelectorAll(".pickcampo:checked")].map(c => c.value);
    if (!escolhidos.length) return alert("Escolha ao menos um campo.");
    const msg = document.getElementById("loteMsg");
    const erros = [];
    let n = 0;
    for (const item of sel) {
      const body = {};
      escolhidos.forEach(key => {
        const el = area.querySelector(`[data-key="${key}"][data-id="${item.id}"]`);
        if (!el) return;
        const raw = el.value.trim();
        if (raw === "") return;                       // vazio = não altera
        body[key] = INT_KEYS.includes(key) ? parseInt(raw) : raw;
      });
      n++;
      msg.textContent = `salvando ${n}/${sel.length}...`;
      if (Object.keys(body).length === 0) continue;
      try { await SDK.patch("/instrumentos/" + item.id, body); }
      catch (e) { erros.push(`${item.codigo_interno || item.id}: ${e.message}`); }
    }
    if (erros.length) { msg.innerHTML = `<span class="sev-erro">${esc(erros.join(" | "))}</span>`; }
    else { fecharModal(); }
    await recarregar();
  };
}
</script>
</body></html>
