<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>sisCalibracao · Catálogo de Calibração</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="vendor/bootstrap-icons.min.css">
<link rel="stylesheet" href="vendor/xcmasm-govbr.css">
<link rel="icon" type="image/png" href="vendor/icons/gauge.png">
<link rel="stylesheet" href="siscalib.css">
</head><body class="app">
<script src="app.js"></script>
<main class="main">
  <div id="tabela"></div>
</main>
<script>
montarShell("catalogo.html");

function money(n) {
  return "R$ " + Number(n || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
const VIG_ORDEM = ["VENCIDO", "A_VENCER_7", "A_VENCER_30", "A_VENCER_60", "VALIDO", "SEM_DATA"];

const tabela = montarTabela({
  el: document.getElementById("tabela"),
  titulo: "Catálogo de Calibração",
  exportNome: "catalogo",
  buscaValor: r => [r.laboratorio, r.contrato_numero, r.descricao].filter(Boolean).join(" "),
  colunas: [
    { key: "laboratorio", label: "Laboratório", filtro: true, render: r => esc(r.laboratorio) || "—" },
    { key: "contrato_numero", label: "Contrato", filtro: true,
      render: r => `${esc(r.contrato_numero)} <span class="bdg slate">${esc(r.contrato_tipo)}</span>` },
    { key: "descricao", label: "Serviço (item)",
      render: r => `${esc(r.descricao) || "—"}${r.item_numero ? ` <span class="muted">· item ${esc(r.item_numero)}</span>` : ""}` },
    { key: "preco", label: "Preço", valor: r => r.preco || 0, render: r => money(r.preco) },
    { key: "saldo", label: "Saldo (qtd)", valor: r => r.saldo, render: r => `${r.saldo} / ${r.quantidade}` },
    { key: "valor_saldo", label: "Valor saldo", valor: r => r.valor_saldo, render: r => money(r.valor_saldo) },
    { key: "status_vigencia", label: "Vigência", filtro: true, ordem: VIG_ORDEM,
      valor: r => r.status_vigencia, rotulo: v => STATUS_LABEL[v] || v,
      render: r => `${fmtData(r.vigencia_fim)} ${badgeStatus(r.status_vigencia)}` },
  ],
});

(async () => {
  try { tabela.setDados((await SDK.get("/catalogo")).itens); }
  catch (err) { /* vazio */ }
})();
</script>
</body></html>
