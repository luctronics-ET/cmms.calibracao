<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SisCalib · Calibrações</title>
<link rel="stylesheet" href="vendor/fonts.css">
<link rel="stylesheet" href="vendor/bootstrap-icons.min.css">
<link rel="stylesheet" href="vendor/xcmasm-govbr.css">
<link rel="stylesheet" href="siscalib.css">
<style>
.busca-res{position:absolute;z-index:1100;background:var(--sf);border:1px solid var(--bd2);
  border-radius:var(--r);min-width:320px;max-height:340px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.busca-res button{display:block;width:100%;text-align:left;background:none;border:none;
  color:var(--tx);padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--bd)}
.busca-res button:hover{background:var(--sf2)}
.busca-res .sub{color:var(--tx3);font-size:12px}
</style>
</head><body class="app">
<script src="app.js"></script>
<main class="main">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
    <h1 style="margin:0">Registro de Calibrações</h1>
    <button class="btn" id="btnCadastrar"><i class="bi bi-plus-lg"></i> Cadastrar calibração</button>
  </div>
  <div class="card" style="margin-top:12px">
    <div class="fld" style="position:relative;margin-bottom:0">
      <label>Instrumento</label>
      <input type="search" id="buscaInst" placeholder="Buscar por código, série, equipamento..." autocomplete="off">
      <div id="buscaRes" class="busca-res" style="display:none"></div>
    </div>
  </div>
  <div id="selecionado"></div>
  <div class="card" style="margin-top:14px">
    <h2 style="margin-top:0;font-size:15px">Calibrações recentes</h2>
    <div id="recentes"><p class="muted">Carregando…</p></div>
  </div>
</main>
<script>
montarShell("calibracao.html");

async function carregarRecentes() {
  const box = document.getElementById("recentes");
  let d;
  try { d = await SDK.get("/calibracoes"); }
  catch (err) { box.innerHTML = `<span class="sev-erro">Falha: ${esc(err.message)}</span>`; return; }
  if (!d.itens.length) { box.innerHTML = '<p class="muted">Nenhuma calibração registrada.</p>'; return; }
  const linhas = d.itens.map(c => `<tr>
      <td><a href="ficha.html?id=${c.instrumento_id}">${esc(c.instrumento_codigo) || c.instrumento_id}</a></td>
      <td>${esc(c.instrumento_equipamento) || "—"}</td>
      <td>${fmtData(c.data_calibracao)}</td>
      <td>${fmtData(c.data_validade)}</td>
      <td>${esc(c.laboratorio) || "—"}</td>
      <td>${esc(c.contrato_numero) || "—"}</td>
    </tr>`).join("");
  box.innerHTML = `<div class="twrap"><table>
    <thead><tr><th>Código</th><th>Equipamento</th><th>Data</th><th>Validade</th><th>Laboratório</th><th>Contrato</th></tr></thead>
    <tbody>${linhas}</tbody></table></div>`;
}
carregarRecentes();

const buscaInst = document.getElementById("buscaInst"),
      buscaRes = document.getElementById("buscaRes"),
      selecionado = document.getElementById("selecionado");
let timer;

async function buscar(q) {
  let dados;
  try { dados = await SDK.get("/instrumentos", { busca: q }); }
  catch (err) { buscaRes.innerHTML = `<div class="sub" style="padding:8px 12px">Erro: ${esc(err.message)}</div>`; buscaRes.style.display = "block"; return; }
  const itens = dados.itens.slice(0, 30);
  if (!itens.length) {
    buscaRes.innerHTML = '<div class="sub" style="padding:8px 12px">Nada encontrado.</div>';
  } else {
    buscaRes.innerHTML = itens.map(i =>
      `<button data-id="${i.id}">
        <b>${esc(i.codigo_interno || i.codigo_patrimonial || "(sem código)")}</b> — ${esc(i.equipamento) || ""}
        <div class="sub">${[i.marca, i.modelo, i.serial].filter(Boolean).map(esc).join(" · ")}</div>
      </button>`).join("");
  }
  buscaRes.style.display = "block";
}

buscaInst.oninput = () => {
  clearTimeout(timer);
  const q = buscaInst.value.trim();
  if (!q) { buscaRes.style.display = "none"; return; }
  timer = setTimeout(() => buscar(q), 200);
};

buscaRes.addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-id]");
  if (!btn) return;
  buscaRes.style.display = "none";
  await selecionar(btn.dataset.id);
});

document.addEventListener("click", (e) => {
  if (!e.target.closest("#buscaInst, #buscaRes")) buscaRes.style.display = "none";
});

async function selecionar(id) {
  const i = await SDK.get("/instrumentos/" + id);
  buscaInst.value = "";
  selecionado.innerHTML = `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <h1 style="margin:0;font-size:17px">${esc(i.codigo_interno || i.codigo_patrimonial || "")} — ${esc(i.equipamento) || ""}</h1>
        <a class="btn ghost" href="ficha.html?id=${i.id}">Ficha completa</a>
      </div>
      <div style="margin-top:10px"><span class="muted">Ciclo: ${i.ciclo_meses ?? 12} meses · Validade atual: ${fmtData(i.data_validade)}</span></div>
      <div id="secaoCalib" data-inst="${i.id}" style="margin-top:14px"></div>
    </div>`;
  // reuso das funções compartilhadas (app.js): histórico + form + upload
  montarSecaoCalibracoes(i.id, () => { carregarRecentes(); return selecionar(id); });
}

// ── Modal "Cadastrar calibração": busca instrumento → form ──────────────────
function abrirCadastro() {
  const ov = abrirModal("Cadastrar calibração", `
    <div class="fld" style="position:relative">
      <label>Instrumento</label>
      <input type="search" id="mBusca" placeholder="Buscar por código, série, equipamento..." autocomplete="off">
      <div id="mRes" class="busca-res" style="display:none"></div>
    </div>
    <div id="mForm"></div>`, "");
  const mBusca = ov.querySelector("#mBusca");
  const mRes = ov.querySelector("#mRes");
  const mForm = ov.querySelector("#mForm");
  let t;
  mBusca.oninput = () => {
    clearTimeout(t);
    const q = mBusca.value.trim();
    if (!q) { mRes.style.display = "none"; return; }
    t = setTimeout(async () => {
      let d;
      try { d = await SDK.get("/instrumentos", { busca: q }); }
      catch (e) { return; }
      const itens = d.itens.slice(0, 30);
      mRes.innerHTML = itens.length
        ? itens.map(i => `<button data-id="${i.id}"><b>${esc(i.codigo_interno || i.codigo_patrimonial || "(sem código)")}</b> — ${esc(i.equipamento) || ""}</button>`).join("")
        : '<div class="sub" style="padding:8px 12px">Nada encontrado.</div>';
      mRes.style.display = "block";
    }, 200);
  };
  mRes.onclick = async (e) => {
    const btn = e.target.closest("button[data-id]");
    if (!btn) return;
    const i = await SDK.get("/instrumentos/" + btn.dataset.id);
    mRes.style.display = "none";
    mBusca.value = `${i.codigo_interno || i.codigo_patrimonial || ""} — ${i.equipamento || ""}`;
    mBusca.disabled = true;
    mForm.innerHTML = "";
    mForm.appendChild(renderFormCalibracao(i.id, () => { fecharModal(); carregarRecentes(); }));
  };
  mBusca.focus();
}
document.getElementById("btnCadastrar").onclick = abrirCadastro;
</script>
</body></html>
